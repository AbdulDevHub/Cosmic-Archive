<!doctype html>
<!-- The repo's share card (1280x640), rendered by scripts/social.mjs from the site's own scene stills. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..700&family=Hanken+Grotesk:wght@400;500;600&family=Syncopate:wght@400;700&display=block" rel="stylesheet" />
<style>
  :root {
    --space: oklch(0.13 0.04 275);
    --ink: oklch(0.95 0.02 85);
    --ink-2: oklch(0.82 0.03 85);
    --beacon: oklch(0.85 0.13 82);
    --glow-violet: oklch(0.68 0.2 300);
    --glow-blue: oklch(0.74 0.14 250);
    --glass: oklch(0.2 0.06 275 / 0.5);
    --glass-edge: oklch(0.95 0.02 85 / 0.16);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--space); }
  body { position: relative; font-family: "Hanken Grotesk", system-ui, sans-serif; color: var(--ink); }

  .bg { position: absolute; inset: 0 0 0 330px; background: url("../public/posters/atlas-start-wide.webp") center / cover no-repeat; }
  .fade { position: absolute; inset: 0;
    background:
      linear-gradient(90deg, var(--space) 26%, oklch(0.13 0.04 275 / 0.82) 44%, oklch(0.13 0.04 275 / 0.1) 72%),
      linear-gradient(0deg, oklch(0.13 0.04 275 / 0.92) 0%, transparent 38%); }

  .copy { position: absolute; left: 72px; top: 50px; width: 600px; }
  .mark { display: flex; align-items: center; gap: 14px; font-family: "Google Sans Flex", sans-serif;
    font-size: 17px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--ink-2); }
  .mark svg { width: 58px; height: 58px; filter: drop-shadow(0 0 8px oklch(0.68 0.2 310 / 0.55)); }
  .word { display: grid; gap: 6px; font-family: "Syncopate", sans-serif; letter-spacing: 0; }
  .word b { font-weight: 700; font-size: 23px; letter-spacing: 0.16em;
    background: linear-gradient(90deg, oklch(0.97 0.02 250), oklch(0.88 0.08 270) 50%, oklch(0.8 0.15 310));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .word i { font-style: normal; font-weight: 400; font-size: 11.5px; letter-spacing: 0.62em; color: oklch(0.86 0.06 275);
    display: flex; align-items: center; gap: 8px; }
  .word i::before, .word i::after { content: ""; flex: 1; height: 1px; background: oklch(0.8 0.13 290 / 0.8); }
  h1 { margin-top: 28px; font-family: "Google Sans Flex", sans-serif; font-weight: 500; font-size: 84px;
    line-height: 0.98; letter-spacing: -0.03em; }
  h1 span { background: linear-gradient(90deg, var(--glow-blue), var(--glow-violet)); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  .lede { margin-top: 24px; font-size: 23px; line-height: 1.4; color: var(--ink-2); max-width: 520px; }

  .stats { margin-top: 26px; display: flex; gap: 10px; }
  .stats div { padding: 9px 16px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-edge);
    font-family: "Google Sans Flex", sans-serif; font-size: 16px; color: var(--ink); }
  .stats b { font-weight: 600; color: var(--beacon); margin-right: 5px; }

  .strip { position: absolute; left: 72px; right: 72px; bottom: 44px; display: flex; align-items: flex-end; gap: 14px; }
  .tile { width: 138px; }
  .tile i { display: block; height: 78px; border-radius: 12px; background-size: cover; background-position: center;
    border: 1px solid var(--glass-edge); box-shadow: 0 10px 30px oklch(0 0 0 / 0.45); }
  .tile p { margin-top: 8px; font-family: "Google Sans Flex", sans-serif; font-size: 13px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-2); }
  .url { margin-left: auto; text-align: right; font-family: "Google Sans Flex", sans-serif; }
  .url p { font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
  .url strong { display: block; margin-top: 6px; font-weight: 500; font-size: 22px; color: var(--ink); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="fade"></div>

  <div class="copy">
    <div class="mark">
      <!-- the header's Emblem (src/components/icons.tsx, D-203) -->
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#1d1846"/><stop offset="1" stop-color="#080818"/></radialGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d58bff" stop-opacity="0.75"/><stop offset="0.45" stop-color="#8f6bff" stop-opacity="0.28"/><stop offset="1" stop-color="#5b4bff" stop-opacity="0"/></radialGradient><linearGradient id="ray" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe0ff"/><stop offset="0.5" stop-color="#c9b8ff"/><stop offset="1" stop-color="#e7a6ff"/></linearGradient><linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ec5ff"/><stop offset="0.5" stop-color="#efeaff"/><stop offset="1" stop-color="#d08cff"/></linearGradient><radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff"/><stop offset="0.35" stop-color="#ffd3ff"/><stop offset="0.7" stop-color="#d36bff"/><stop offset="1" stop-color="#8a4dff" stop-opacity="0"/></radialGradient></defs>
        <circle cx="32" cy="32" r="24" fill="url(#glow)"/><path d="M32 1.5L34.4 23.5L32 26.5L29.6 23.5ZM39.46 13.98L36.64 24.72L34.1 26.92L33.87 23.57ZM50.03 13.97L39.42 27.4L35.89 28.11L36.6 24.58ZM50.02 24.54L40.43 30.13L37.08 29.9L39.28 27.36ZM62.5 32L40.5 34.4L37.5 32L40.5 29.6ZM50.02 39.46L39.28 36.64L37.08 34.1L40.43 33.87ZM50.03 50.03L36.6 39.42L35.89 35.89L39.42 36.6ZM39.46 50.02L33.87 40.43L34.1 37.08L36.64 39.28ZM32 62.5L29.6 40.5L32 37.5L34.4 40.5ZM24.54 50.02L27.36 39.28L29.9 37.08L30.13 40.43ZM13.97 50.03L24.58 36.6L28.11 35.89L27.4 39.42ZM13.98 39.46L23.57 33.87L26.92 34.1L24.72 36.64ZM1.5 32L23.5 29.6L26.5 32L23.5 34.4ZM13.98 24.54L24.72 27.36L26.92 29.9L23.57 30.13ZM13.97 13.97L27.4 24.58L28.11 28.11L24.58 27.4ZM24.54 13.98L30.13 23.57L29.9 26.92L27.36 24.72Z" fill="url(#ray)" opacity="0.92"/><g fill="none" stroke="url(#orbit)" stroke-width="1.8"><ellipse cx="32" cy="32" rx="20" ry="7.5" transform="rotate(-30 32 32)"/><ellipse cx="32" cy="32" rx="20" ry="7.5" transform="rotate(34 32 32)" opacity="0.8"/></g><circle cx="32" cy="32" r="9" fill="url(#core)"/><circle cx="32" cy="32" r="3.2" fill="#fff"/><circle cx="49.2" cy="22" r="2.2" fill="#efeaff"/>
      </svg>
      <span class="word"><b>Cosmic</b><i>Atlas</i></span>
    </div>
    <h1>The <span>Universe</span><br />to Look At</h1>
    <p class="lede">Real-time scenes you click through, from a spiral galaxy out to the omniverse.</p>
    <div class="stats">
      <div><b>50</b>Places</div>
      <div><b>6</b>Zoom Levels</div>
      <div>Drawn Live in WebGL</div>
    </div>
  </div>

  <div class="strip">
    <div class="tile"><i style="background-image:url('../public/posters/black-hole-wide.webp')"></i><p>A Black Hole</p></div>
    <div class="tile"><i style="background-image:url('../public/posters/nebula-wide.webp')"></i><p>A Nebula</p></div>
    <div class="tile"><i style="background-image:url('../public/posters/ringworld-wide.webp')"></i><p>A Ringworld</p></div>
    <div class="tile"><i style="background-image:url('../public/posters/omniverse-wide.webp')"></i><p>The Omniverse</p></div>
    <div class="url"><p>Open Source · Next.js · Three.js</p><strong>the-cosmic-atlas.vercel.app</strong></div>
  </div>
</body>
</html>
